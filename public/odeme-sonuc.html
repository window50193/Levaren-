<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LÉVAREN — Ödeme sonucu</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:650px;margin:10vh auto;padding:30px;text-align:center"><span class="eyebrow">LÉVAREN</span><h1 id="title">Ödeme sonucu kontrol ediliyor</h1><p id="text">Ödeme sonucunuz doğrulanıyor. Lütfen bu sayfayı kapatmayın.</p><p id="order"></p><a class="btn" href="/">Mağazaya dön</a></main><script>
const q=new URLSearchParams(location.search),order=q.get('order'),initial=q.get('status');
async function check(){try{const token=localStorage.getItem('lv_token');if(!token||!order){document.querySelector('#text').textContent=initial==='success'?'Ödeme sonucu alındı. Siparişiniz hesabınızdan kontrol edilebilir.':'Ödeme tamamlanamadı veya iptal edildi.';return true}const r=await fetch('/api/orders/'+encodeURIComponent(order)+'/status',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error();document.querySelector('#order').textContent='Sipariş: '+d.id;if(d.paymentStatus==='Ödendi'){document.querySelector('#title').textContent='Ödeme başarılı';document.querySelector('#text').textContent='Ödemeniz başarıyla alındı. Siparişiniz hazırlanmaya başlayacak.';localStorage.removeItem('lv_cart');localStorage.removeItem('lv_coupon');return true}if(d.paymentStatus==='Ödeme başarısız'){document.querySelector('#title').textContent='Ödeme başarısız';document.querySelector('#text').textContent='Ödeme tamamlanamadı. Sepetiniz korunuyor; tekrar deneyebilirsiniz.';return true}document.querySelector('#text').textContent='Ödeme sonucu bekleniyor…';return false}catch(e){return false}}
(async()=>{for(let i=0;i<10;i++){if(await check())break;await new Promise(r=>setTimeout(r,1500));}})();</script></body></html>
